name: Build PSP Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install PSPSDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libusb-dev
          git clone https://github.com/pspdev/pspdev.git
          cd pspdev
          ./build-all.sh || true
      - name: Build EBOOT
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH
          make || psp-gcc -I$PSPDEV/psp/sdk/include -L$PSPDEV/psp/sdk/lib -lpspdebug -lpspdisplay -lpspge -lpspctrl -lpspsdk -o main.o -c main.c
          echo "Build done"
      - name: Upload EBOOT
        uses: actions/upload-artifact@v3
        with:
          name: God-Of-Strength-PSP
          path: |
            *.PBP
            *.png
            *.jpg
            EBOOT.PBP
