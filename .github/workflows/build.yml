name: Build PSP Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build EBOOT
        run: |
          make
          ls -lh EBOOT.PBP
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: God-Of-Strength-EBOOT
          path: EBOOT.PBP
